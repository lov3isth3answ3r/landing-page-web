    <title>Love Is The Answer - Coming Soon</title>

    <div class="container">
        <!-- Logo

        <!-- Main Heading -->
        <h1>Love Is The Answer</h1>
        
        <!-- Tagline -->
        <p class="tagline">Spreading love, one moment at a time</p>

        <!-- Video -->
        <div class="video-container">
            <video class="main-video" autoplay loop muted playsinline>
                <source src="assets/LITA-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Coming Soon Badge -->
        <div class="coming-soon">Coming Soon</div>
        
        <!-- Description -->
        <p class="description">
            We're working on something special. Be the first to know when we launch!
        </p>
        
        <!-- Email Notification Form -->
        <form id="notifyForm" class="notify-form">
            <input 
                type="email" 
                id="emailInput"
                class="email-input" 
                placeholder="Enter your email address" 
                required
                aria-label="Email address"
                autocomplete="email"
            >
            <button type="submit" class="notify-btn">Notify Me</button>
        </form>
        
        <!-- Success Message -->
        <div id="successMessage" class="success-message"></div>
        
        <!-- Social Links -->
        <div class="social-links">
            <a href="https://instagram.com/LOVEistheANSW3R" 
               class="social-link" 
               aria-label="Follow us on Instagram"
               target="_blank"
               rel="noopener noreferrer"
               onclick="trackSocialClick('Instagram')">📷</a>

            <a href="https://twitter.com/loveistheanswer"

        <footer class="footer">
